plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org" }
    maven { url "https://djl.ai/maven" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://repo.viaversion.com" }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("dev.redstones.mediaplayerinfo:media-player-info:0.1.0")

    modImplementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor'org.projectlombok:lombok:1.18.34'

    modImplementation files("libs/baritone-standalone-fabric-783d120.jar")
    modImplementation files("libs/nether-pathfinder-1.6.jar")
    modImplementation "com.viaversion:viaversion-api:5.5.1"

    compileOnly files("libs/obfuscator.jar")
    annotationProcessor files("libs/obfuscator.jar")
}

loom {
    accessWidenerPath = file("src/main/resources/luxury.acesswidener")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// ========== PROGUARD ОБФУСКАЦИЯ ==========

task obfuscateJar {
    dependsOn remapJar
    group = 'build'
    description = 'Obfuscates the mod JAR using ProGuard'

    doLast {
        println "=== Starting ProGuard Obfuscation (Java 21) ==="

        def proguardJar = file("libs/proguard.jar")
        if (!proguardJar.exists()) {
            throw new GradleException("ProGuard JAR not found at: ${proguardJar.path}")
        }

        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = file("${buildDir}/libs/${archivesBaseName}-${version}-obf.jar")

        // Создаем директорию если не существует
        outputJar.parentFile.mkdirs()

        println "Input JAR: ${inputJar}"
        println "Output JAR: ${outputJar}"

        // Получаем все зависимости для libraryjars
        def classpathFiles = []
        configurations.runtimeClasspath.each { file ->
            if (file.exists() && file.isFile() && !file.name.contains("minecraft")) {
                classpathFiles.add(file.absolutePath)
            }
        }

        // Создаем временный файл с конфигурацией
        def tempConfig = file("${buildDir}/temp-proguard.pro")
        tempConfig.text = """
# ========== НАСТРОЙКА ДЛЯ FABRIC/MINECRAFT ==========

# Основные настройки
-dontoptimize
-dontshrink
-dontpreverify
-dontnote
-dontwarn

# КРИТИЧЕСКИ ВАЖНО: сохраняем StackMapTable
-keepattributes Signature,InnerClasses,EnclosingMethod,Exceptions,Deprecated,SourceFile,LineNumberTable,LocalVariable*Table,*Annotation*,RuntimeVisible*Annotations,RuntimeInvisible*Annotations,RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations,StackMapTable

# ========== СОХРАНЕНИЕ MIXIN ==========

# ВСЕ классы в пакете mixin должны остаться нетронутыми
-keep class dev.luxury.mixin.** { 
    *; 
}

# Сохраняем все методы и поля в mixin классах
-keepclassmembers class dev.luxury.mixin.** {
    *;
}

# Сохраняем имена классов mixin
-keepnames class dev.luxury.mixin.**

# ========== MIXIN АННОТАЦИИ И СИСТЕМА ==========

# Сохраняем все классы с аннотацией @Mixin
-keep @org.spongepowered.asm.mixin.Mixin class * { *; }

# Сохраняем все классы в пакетах mixin
-keep class **.mixin.** { *; }

# Сохраняем все аннотации Mixin
-keep @org.spongepowered.asm.mixin.** class * { *; }

# Сохраняем методы с аннотациями Mixin
-keepclassmembers class * {
    @org.spongepowered.asm.mixin.injection.* *;
    @org.spongepowered.asm.mixin.gen.* *;
}

# ========== FABRIC И МОД СИСТЕМА ==========

# Fabric API
-keep class net.fabricmc.** { *; }
-keep class net.fabricmc.api.** { *; }

# Главные классы мода
-keep @net.fabricmc.api.Mod class * { *; }

# Сохраняем точку входа мода
-keep class * implements net.fabricmc.api.ClientModInitializer { 
    public void onInitializeClient(); 
}

# ========== ТВОИ КЛАССЫ ==========


# УДАЛИ ЭТУ СТРОКУ! Она сохраняет все классы:
# -keep class dev.luxury.** { *; }

# Вместо нее используй более конкретные правила:

# Для шифрования имен классов используй:
 -repackageclasses 'a.b.c'  # Перепаковывает классы в указанный пакет
 -allowaccessmodification   # Позволяет изменять модификаторы доступа

# Шифруем имена (опционально)
# -obfuscationdictionary 'dictionary.txt'  # Свой словарь для имен
# -classobfuscationdictionary 'classdict.txt'

# ========== ДЛЯ ШИФРОВАНИЯ/ОБФУСЦИКАЦИИ ==========

# Включаем обфускацию
-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable

# Для шифрования имен классов (необязательно, но рекомендуется)
# -repackageclasses ''
# -allowaccessmodification

# Правила для Reflection API
-keepclassmembers class * {
    @java.lang.Override *;
}

# Правила для сериализации
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# ========== НЕОБХОДИМЫЕ КЛАССЫ ДЛЯ МОДА ==========

# Сохраняем названия GUI классов
-keep class dev.luxury.ui.** {
    public *;
}

# Сохраняем утилиты для рендеринга
-keep class dev.luxury.utils.render.** {
    public *;
}

# Сохраняем шрифты
-keep class dev.luxury.utils.font.** {
    public *;
}

# ========== ОБЩИЕ ПРАВИЛА ==========

# Сохраняем enum
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Сохраняем сигнатуры для дженериков
-keepattributes Signature

# Java 21
-target 21

# ========== АГРЕССИВНАЯ ОБФУСЦИКАЦИЯ (добавь если хочешь) ==========
# -overloadaggressively
# -useuniqueclassmembernames
# -flattenpackagehierarchy ''
# -repackageclasses ''
# -allowaccessmodification

# ========== ПУТИ ФАЙЛОВ ==========
-injars '${inputJar.absolutePath}'
-outjars '${outputJar.absolutePath}'

# Java библиотеки
-libraryjars '${System.getProperty("java.home")}/jmods/java.base.jmod'
-libraryjars '${System.getProperty("java.home")}/jmods/java.desktop.jmod'

# Зависимости
"""

        println "Running ProGuard with temporary config..."

        try {
            exec {
                workingDir projectDir
                commandLine 'java', '-jar', proguardJar.path, '@' + tempConfig.absolutePath
                ignoreExitValue = false
            }
            println "=== Obfuscation Complete! ==="
            println "Output: ${outputJar}"
        } catch (Exception e) {
            println "ProGuard failed: ${e.message}"
            println "Creating fallback (copy) JAR..."

            // Создаем резервную копию если ProGuard падает
            copy {
                from inputJar
                into outputJar.parent
                rename { outputJar.name }
            }
            println "Fallback JAR created at: ${outputJar}"
        } finally {
            // Удаляем временный файл
            if (tempConfig.exists()) {
                tempConfig.delete()
            }
        }
    }
}

task testObfuscation {
    dependsOn remapJar
    group = 'build'

    doLast {
        def inputJar = remapJar.archiveFile.get().asFile
        def outputJar = file("${buildDir}/libs/${archivesBaseName}-${version}-test.jar")

        println "Testing JAR structure..."

        exec {
            commandLine 'jar', 'tf', inputJar.path
        }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}